name: Release

# Two ways to cut a release:
#   - locally: `npm run release -- 0.2.0` then `git push --follow-tags`
#   - on GitHub: Actions → Release → Run workflow, enter 0.2.0 (bumps, commits and tags main)
# Either way the installers are built, signed for the updater and published as a GitHub
# release. Installed copies pick it up through latest.json (see plugins.updater in
# src-tauri/tauri.conf.json). Tags with a suffix (v0.2.0-beta.1) become pre-releases, which
# the updater ignores.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the release workflow from main"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs "$VERSION"
          git push --atomic origin HEAD:main "v${VERSION#v}"

      - name: Resolve tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v${VERSION#v}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          node scripts/release.mjs --check "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          # Install instructions go above the notes GitHub generates from merged PRs.
          body=$(sed -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" -e "s|{{TAG}}|$TAG|g" .github/release-notes.md)
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f name="Snipit $TAG" \
            -f body="$body" \
            -F draft=true \
            -F prerelease="$prerelease" \
            -F generate_release_notes=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build Windows installers
    needs: [prepare, create-release]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # Without the updater key the installers are still published, but installed copies
      # won't be offered this version as an update. See docs/RELEASING.md to add the key.
      - name: Check updater signing key
        id: signing
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so this release has no auto-update (latest.json). See docs/RELEASING.md."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # With the key: also produces the .sig files and latest.json the in-app updater reads.
          args: ${{ steps.signing.outputs.args }}
          # Update through the NSIS installer (per-user, no admin prompt), not the MSI.
          updaterJsonPreferNsis: true

      # Fixed names, so the README and website can link to
      # releases/latest/download/Snipit-Setup.exe and always get the newest installer.
      - name: Upload Snipit-Setup.exe, Snipit-Setup.msi and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.create-release.outputs.id }}
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle
          mkdir -p upload
          cp "$(ls "$bundle"/nsis/*-setup.exe | head -n1)" upload/Snipit-Setup.exe
          cp "$(ls "$bundle"/msi/*.msi | head -n1)" upload/Snipit-Setup.msi
          cp "$bundle"/nsis/*-setup.exe "$bundle"/msi/*.msi upload/
          (cd upload && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          for file in Snipit-Setup.exe Snipit-Setup.msi SHA256SUMS.txt; do
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$file" \
              --input "upload/$file" --jq .browser_download_url
          done

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.create-release.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false
